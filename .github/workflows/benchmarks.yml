name: Benchmarks

on:
  workflow_dispatch:
    inputs:
      runs:
        description: "Timed runs per binary"
        required: false
        default: "10"
      update_results:
        description: "Open a pull request with the regenerated results"
        type: boolean
        default: true
  schedule:
    - cron: '0 4 * * 1'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: benchmarks-${{ github.ref }}
  cancel-in-progress: false

jobs:
  benchmark:
    name: Run the benchmark suite
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Set up the LLVM toolchain
        shell: bash
        run: scripts/ci/llvm.sh --install

      - name: Build the compiler
        shell: bash
        run: mvn --batch-mode --no-transfer-progress -q -Dmaven.test.skip=true package

      - name: Run the benchmarks
        shell: bash
        run: |
          set -euo pipefail
          python3 benchmarks/bench.py \
            --no-build \
            --runs "${{ inputs.runs || '10' }}" \
            --warmup 2 \
            --output benchmarks/RESULTS.md \
            --json benchmarks/results/latest.json

      - name: Upload the benchmark report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-results
          path: |
            benchmarks/RESULTS.md
            benchmarks/results/latest.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Open the benchmark results pull request
        id: pr
        if: ${{ github.event_name == 'schedule' || inputs.update_results == true }}
        continue-on-error: true
        uses: peter-evans/create-pull-request@v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          add-paths: benchmarks/RESULTS.md
          branch: benchmarks/results
          delete-branch: true
          commit-message: "bench: update benchmark results"
          title: "bench: update benchmark results"
          body: |
            Regenerate `benchmarks/RESULTS.md` with the latest benchmark suite.
          labels: benchmarks

      - name: Warn if the pull request could not be created
        if: steps.pr.outcome == 'failure'
        shell: bash
        run: |
          echo "::warning::Could not create the benchmark pull request. Enable 'Allow GitHub Actions to create and approve pull requests' under Settings > Actions > General."
