name: Greetings

on: [pull_request_target, issues]

jobs:
  greeting:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
      pull-requests: write
    steps:
    - uses: actions/first-interaction@v3
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        issue_message: "Hello, thanks for reporting an issue. We'll look into this as soon as possible"
        pr_message: "Hello, thanks for trying to make a pull request. We'll review it as soon as possible"
