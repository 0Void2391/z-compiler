# Lint: checks the GitHub Actions workflows themselves (actionlint), all YAML
# files (yamllint) and the Markdown documentation (markdownlint).
#
# Rules live in the repository so the exact same checks run locally:
#   actionlint            # workflows
#   yamllint -c .yamllint.yml .
#   npx markdownlint-cli2 "**/*.md"
# or simply: scripts/ci/local-check.sh
name: Lint

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: actionlint, yamllint, markdownlint
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install linters
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/tools"
          curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash \
            | bash -s -- latest "$HOME/tools"
          echo "$HOME/tools" >> "$GITHUB_PATH"
          pipx install yamllint
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: actionlint (GitHub Actions workflows)
        run: actionlint -color -verbose

      - name: yamllint (YAML files)
        run: yamllint -c .yamllint.yml .

      - name: markdownlint (Markdown files)
        run: npx --yes markdownlint-cli2 "**/*.md" "#target" "#bin" "#dist"
